about:
  intro: "Xin chào! Mình là Dương Như Quỳnh, sinh viên ngành Sư phạm Âm nhạc tại Trường Đại học Sư phạm Nghệ thuật Trung ương."
  hobbies: "Hát"
  learning_goal: |
    Sau khi hoàn thành môn học Công nghệ số, tôi đặt mục tiêu vận dụng những kiến thức và kỹ năng đã học vào quá trình học tập cũng như công việc trong tương lai. Thông qua môn học, tôi đã có thêm hiểu biết về công nghệ số, cách sử dụng các công cụ và phần mềm hỗ trợ học tập, kỹ năng tìm kiếm, chọn lọc, lưu trữ và quản lý thông tin trên môi trường số. Bên cạnh đó, tôi còn được tiếp cận với các công cụ trí tuệ nhân tạo (AI), biết cách ứng dụng công nghệ để thiết kế bài trình chiếu, xây dựng nội dung học tập và tạo ra những sản phẩm số phục vụ cho việc học tập.

    Trong thời gian tới, tôi mong muốn tiếp tục trau dồi kỹ năng sử dụng công nghệ, nâng cao khả năng sáng tạo và chủ động cập nhật những kiến thức mới. Đặc biệt, với định hướng trở thành một giáo viên Âm nhạc, tôi sẽ vận dụng công nghệ số vào việc thiết kế bài giảng điện tử, tạo trò chơi âm nhạc, xây dựng video minh họa và tổ chức các hoạt động học tập sinh động, hấp dẫn dành cho học sinh.

    Tôi cũng đặt mục tiêu xây dựng cho mình một môi trường học tập số khoa học, biết cách lưu trữ và sắp xếp các tài liệu, bài tập, sản phẩm cá nhân một cách hợp lý để thuận tiện cho việc tra cứu và chia sẻ. Qua đó, tôi mong muốn hoàn thiện bản thân, phát triển năng lực chuyên môn, kỹ năng số và khả năng thích ứng với sự phát triển của công nghệ trong thời đại hiện nay.
  portfolio_goal: "Lưu trữ sản phẩm cá nhân để thuận tiện truy cập và chia sẻ."

projects:
  - id: 1
    section: "1.4"
    title: "Thao tác cơ bản với tệp tin và thư mục"
    chapter: "Chương 1 – Máy tính và các thiết bị ngoại vi"
    objective: "Thiết lập một cấu trúc thư mục khoa học cho toàn bộ tài liệu học tập ngành Sư phạm Âm nhạc (bài giảng, bản nhạc, file ghi âm luyện tập, giáo án) và một quy tắc đặt tên tệp thống nhất. Kỹ năng rèn luyện: tạo – đổi tên – di chuyển – sao lưu tệp tin, tổ chức dữ liệu để tìm kiếm nhanh."
    process:
      - "Bước 1: Thống kê các loại tài liệu đang có: slide bài giảng (PDF), bản nhạc (PDF/ảnh chụp), file ghi âm luyện thanh (M4A), giáo án (DOCX), video tiết dạy mẫu (MP4)."
      - "Bước 2: Phác thảo sơ đồ cây thư mục theo nguyên tắc Học kỳ → Môn học → Loại tài liệu, tối đa 3 cấp."
      - "Bước 3: Đặt quy tắc đặt tên tệp: Ngày_Môn_NộiDung_PhiênBản, viết không dấu, ngăn cách bằng dấu gạch dưới."
      - "Bước 4: Tạo cấu trúc trên máy tính bằng File Explorer, đổi tên hàng loạt các tệp cũ theo quy tắc mới."
      - "Bước 5: Đồng bộ thư mục gốc lên Google Drive để sao lưu và mở được trên điện thoại khi đi học."
      - "Khó khăn: File ghi âm từ điện thoại có tên tự động khó phân biệt (VID_2026…, Recording 12…) – giải quyết bằng cách nghe lại, đổi tên ngay sau mỗi buổi luyện tập và thêm tiền tố ngày."
    tool: "File Explorer (Windows), Google Drive"
    ai_use: "Không sử dụng AI"
