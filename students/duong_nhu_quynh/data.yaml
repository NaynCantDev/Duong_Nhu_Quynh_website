  - id: 6
    section: "6.4"
    title: "Sử dụng AI có trách nhiệm trong học tập và nghiên cứu"
    chapter: "Chương 6 – An toàn và liêm chính học thuật trong môi trường số"
    objective: "Tìm hiểu các hướng dẫn về sử dụng AI trong giáo dục, phân tích những tình huống “vùng xám” thường gặp với sinh viên Sư phạm Âm nhạc và xây dựng bộ nguyên tắc cá nhân về sử dụng AI có trách nhiệm."
    process:
      - "Bước 1: Đọc tài liệu Guidance for generative AI in education and research (UNESCO, 2023), bài giảng Chương 6 và quy định về sử dụng AI trong đề thi học phần."
      - "Bước 2: Liệt kê các tình huống sử dụng AI trong học tập ngành Âm nhạc và phân loại: hợp lệ – vùng xám – vi phạm."
      - "Bước 3: Rút ra 5 nguyên tắc cá nhân, viết ngắn gọn để dễ ghi nhớ và áp dụng."
      - "Bước 4: Trình bày bộ nguyên tắc dưới dạng thẻ “AI có trách nhiệm” để dán vào góc học tập."
      - "Khó khăn: Ranh giới giữa “nhờ AI sửa lời” và “nhờ AI viết hộ” chưa rõ – giải quyết bằng câu hỏi tự kiểm tra: nếu bỏ AI đi, mình có tự giải thích và làm lại được phần đó không?"
      - "AI: Dùng ChatGPT tóm tắt các ý chính của tài liệu UNESCO; nội dung nguyên tắc do tự xây dựng."
    tool: "ChatGPT, Canva, tài liệu UNESCO (2023)"
    ai_use: "ChatGPT – tóm tắt tài liệu tham khảo"
    product:
      intro: "Bộ 5 nguyên tắc cá nhân về sử dụng AI có trách nhiệm:"
      blocks:
        - type: principles
          items:
            - { t: "Minh bạch", d: "Luôn ghi rõ công cụ AI đã dùng và dùng vào phần nào của bài." }
            - { t: "Kiểm chứng", d: "Đối chiếu kiến thức nhạc lý, tên tác giả, xuất xứ bài hát với giáo trình và nguồn chính thống." }
            - { t: "Tôn trọng bản quyền", d: "Không dùng AI sao chép lời ca, bản nhạc của người khác rồi nộp như sản phẩm của mình; luôn ghi nguồn." }
            - { t: "AI hỗ trợ, không thay thế", d: "Kỹ năng hát, đàn, đứng lớp phải tự rèn luyện; AI chỉ là công cụ gợi ý." }
            - { t: "Bảo vệ dữ liệu", d: "Không đưa giọng hát, hình ảnh, thông tin của học sinh hay bạn bè lên công cụ AI khi chưa được cho phép." }
        - type: scenarios
          title: "Phân tích các tình huống"
          items:
            - { s: "Nhờ AI giải thích lại khái niệm nhạc lý chưa hiểu", v: "ok", r: "Hỗ trợ học tập, tự kiểm chứng lại với giáo trình" }
            - { s: "Nhờ AI gợi ý trò chơi âm nhạc cho giáo án, sau đó tự chỉnh sửa", v: "ok", r: "Có ghi rõ AI hỗ trợ và có đóng góp của bản thân" }
            - { s: "Nhờ AI viết lại toàn bộ bài cảm nhận rồi chỉ sửa vài từ", v: "gray", r: "Nội dung cảm nhận phải do sinh viên tự viết" }
            - { s: "Dùng AI tạo giai điệu rồi nộp như sáng tác của mình", v: "bad", r: "Không trung thực về tác giả sản phẩm" }
            - { s: "Tải file ghi âm giọng hát học sinh lên app AI để chấm", v: "bad", r: "Chưa có sự đồng ý, vi phạm quyền riêng tư" }
        - type: refs
          title: "Tài liệu tham khảo"
          items:
            - "UNESCO (2023). Guidance for generative AI in education and research. Paris: UNESCO."
            - "Bài giảng Chương 6 – An toàn và liêm chính học thuật trong môi trường số, học phần Nhập môn Công nghệ số và ứng dụng trí tuệ nhân tạo."
            - "Quy định về sử dụng AI và liêm chính học thuật trong đề thi kết thúc học phần INF2501."
      gallery: []

conclusion:
  # ⚠ Theo quy định đề thi: nội dung cảm nhận, tự đánh giá phải do sinh viên TỰ VIẾT.
  #   Đoạn dưới đây chỉ là bản nháp để Quỳnh viết lại bằng lời của mình.
  experience: "Xây dựng Portfolio giúp mình nhìn lại cả hành trình học phần: từ việc sắp xếp lại kho tài liệu, bản nhạc, file ghi âm cho gọn gàng đến việc biết dùng AI như một trợ lý học tập. Mình nhận ra kỹ năng số không tách rời chuyên ngành Âm nhạc mà giúp việc học hát, soạn giáo án và làm việc nhóm hiệu quả hơn."
  key_skills:
    - "Tổ chức và sao lưu tài liệu học tập khoa học"
    - "Tìm kiếm và đánh giá nguồn tin học thuật bằng tiêu chí CRAAP"
    - "Viết prompt rõ ràng cho các tác vụ học tập và giảng dạy"
    - "Phối hợp nhóm trực tuyến và sử dụng AI có trách nhiệm"
  highlight: "Điểm tâm đắc nhất là Bài 5 – infographic khởi động giọng: mình được kết hợp kiến thức thanh nhạc với công cụ thiết kế có hỗ trợ AI để tạo ra một sản phẩm có thể dùng ngay khi đi thực tập dạy học."
  challenge: "Thách thức lớn nhất là kiểm tra lại độ chính xác của nội dung do AI gợi ý và sắp xếp thời gian giữa giờ luyện tập chuyên ngành với các bài tập của học phần. Mình giải quyết bằng cách luôn đối chiếu với giáo trình và lên lịch cụ thể cho từng bài."
  future: "Tiếp tục ứng dụng công nghệ số và AI vào việc soạn bài giảng Âm nhạc, xây dựng kho học liệu số cho học sinh và cập nhật Portfolio này trong suốt quá trình học tập."
