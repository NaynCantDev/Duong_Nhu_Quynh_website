  - id: 5
    section: "5.4"
    title: "Sử dụng AI tạo sinh để hỗ trợ sáng tạo nội dung"
    chapter: "Chương 5 – Sáng tạo nội dung số"
    objective: "Sử dụng công cụ AI tạo sinh để hỗ trợ thiết kế một sản phẩm nội dung số hoàn chỉnh: infographic “5 bước khởi động giọng trước giờ học hát” dành cho học sinh THCS; đồng thời đánh giá vai trò và giới hạn của AI trong quá trình sáng tạo."
    process:
      - "Bước 1: Lên ý tưởng và tự viết nội dung 5 bước khởi động giọng dựa trên kiến thức môn Thanh nhạc."
      - "Bước 2: Nhờ ChatGPT rút gọn câu chữ cho phù hợp lứa tuổi THCS, sau đó tự kiểm tra lại tính chính xác chuyên môn."
      - "Bước 3: Dùng Canva (Magic Design) gợi ý bố cục; dùng tính năng tạo ảnh bằng AI của Canva để tạo hình minh họa nốt nhạc, micro."
      - "Bước 4: Chỉnh sửa thủ công: đổi bảng màu, căn chỉnh chữ, thay hình AI bị lỗi, thêm nguồn tham khảo."
      - "Khó khăn: Hình AI tạo ra vẽ sai khuông nhạc (6 dòng kẻ) – giải quyết bằng cách thay bằng biểu tượng khuông nhạc có sẵn trong thư viện Canva."
      - "AI: ChatGPT – rút gọn câu chữ; Canva AI – gợi ý bố cục và tạo hình minh họa."
    tool: "Canva (Magic Design, tạo ảnh AI), ChatGPT"
    ai_use: "ChatGPT – rút gọn câu chữ; Canva AI – bố cục & hình minh họa"
    product:
      intro: "Nội dung infographic hoàn thiện (khổ A4 dọc, đã xuất bản dạng PNG và PDF):"
      blocks:
        - type: showcase
          title: "5 bước khởi động giọng trước giờ học hát"
          subtitle: "Dành cho học sinh THCS · 5 phút mỗi ngày"
          steps:
            - { icon: "🧍", t: "Tư thế đúng", d: "Đứng thẳng, hai chân rộng bằng vai, vai thả lỏng, mắt nhìn thẳng." }
            - { icon: "🌬️", t: "Hít thở bằng bụng", d: "Hít sâu bằng mũi 4 nhịp, giữ 2 nhịp, thở ra chậm bằng miệng 6 nhịp. Lặp lại 5 lần." }
            - { icon: "👄", t: "Rung môi", d: "Thả lỏng môi, thổi hơi cho môi rung “brrr” theo các nốt lên xuống." }
            - { icon: "🎵", t: "Luyện âm “ma – me – mi – mo – mu”", d: "Hát theo gam 5 nốt đi lên rồi đi xuống, mở khẩu hình tròn, không gào." }
            - { icon: "💧", t: "Nghỉ & uống nước ấm", d: "Uống vài ngụm nước ấm; dừng ngay nếu thấy đau rát cổ họng." }
        - type: split
          title: "Tỷ lệ đóng góp trong sản phẩm"
          items:
            - { label: "Tự thực hiện: ý tưởng, nội dung chuyên môn, chỉnh sửa, kiểm tra", pct: 70 }
            - { label: "AI hỗ trợ: rút gọn câu chữ, gợi ý bố cục, hình minh họa", pct: 30 }
        - type: note
          text: "Nhận xét: AI giúp tiết kiệm thời gian thiết kế, nhưng không thay được kiến thức chuyên môn – mọi nội dung về kỹ thuật thanh nhạc đều phải tự kiểm chứng trước khi đưa cho học sinh."
      gallery: []
