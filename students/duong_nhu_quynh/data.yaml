  - id: 2
    section: "2.4"
    title: "Tìm kiếm và đánh giá thông tin học thuật"
    chapter: "Chương 2 – Khai thác dữ liệu và thông tin"
    objective: "Sử dụng các toán tử tìm kiếm nâng cao để tìm tài liệu học thuật về chủ đề “Ứng dụng công nghệ số trong dạy học Âm nhạc ở trường phổ thông”, sau đó đánh giá độ tin cậy của nguồn tin theo bộ tiêu chí CRAAP. Kỹ năng rèn luyện: xây dựng truy vấn, lọc kết quả, đánh giá nguồn."
    process:
      - "Bước 1: Xác định từ khóa tiếng Việt và tiếng Anh: dạy học âm nhạc / music education, công nghệ / technology, trí tuệ nhân tạo / artificial intelligence."
      - "Bước 2: Kết hợp từ khóa với các toán tử AND, OR, dấu “ ”, site:, filetype:, intitle: trên Google và Google Scholar."
      - "Bước 3: Lọc kết quả theo năm xuất bản (ưu tiên từ 2018 trở lại đây) và loại tài liệu."
      - "Bước 4: Chọn 5 nguồn tiêu biểu, chấm điểm theo 5 tiêu chí CRAAP (Currency – Relevance – Authority – Accuracy – Purpose), mỗi tiêu chí 10 điểm."
      - "Khó khăn: Nhiều kết quả tiếng Việt là bài blog, không rõ tác giả – giải quyết bằng cách thêm site:.edu.vn, site:gov.vn và ưu tiên tìm bằng tiếng Anh trên Google Scholar."
      - "AI: Dùng ChatGPT để giải thích ý nghĩa từng tiêu chí CRAAP; việc tìm kiếm và chấm điểm do tự thực hiện."
    tool: "Google Search, Google Scholar, ChatGPT"
    ai_use: "ChatGPT – giải thích tiêu chí CRAAP"
    product:
      intro: "Các truy vấn nâng cao đã sử dụng và mục đích của từng truy vấn:"
      blocks:
        - type: queries
          items:
            - { q: '"music education" AND technology', op: 'AND, " "', why: "Tìm bài viết có đúng cụm music education và có nhắc tới technology" }
            - { q: '"music education" AND ("artificial intelligence" OR AI)', op: "AND, OR, ( )", why: "Mở rộng sang các nghiên cứu về AI trong giáo dục âm nhạc" }
            - { q: 'chương trình môn Âm nhạc site:moet.gov.vn', op: "site:", why: "Chỉ lấy văn bản chính thức từ trang Bộ Giáo dục và Đào tạo" }
            - { q: '"phương pháp dạy hát" filetype:pdf', op: 'filetype:, " "', why: "Tìm giáo trình, bài báo dạng PDF" }
            - { q: 'intitle:"music teacher" technology', op: "intitle:", why: "Chỉ lấy tài liệu có music teacher ngay trong tiêu đề" }
            - { q: '"dạy học âm nhạc" công nghệ -quảng cáo', op: '" ", -', why: "Loại bỏ các trang quảng cáo khóa học" }
        - type: table
          title: "Bảng đánh giá nguồn tin theo CRAAP (tự chấm, thang 50)"
          headers: ["Nguồn", "Loại", "C", "R", "A", "A", "P", "Tổng", "Kết luận"]
          rows:
            - ["Chương trình GDPT môn Âm nhạc (Bộ GD&ĐT, 2018)", "Văn bản chính thức", "8", "10", "10", "10", "10", "48", "✅ Tin cậy cao"]
            - ["Guidance for generative AI in education and research (UNESCO, 2023)", "Báo cáo tổ chức quốc tế", "10", "8", "10", "9", "9", "46", "✅ Tin cậy cao"]
            - ["Bài báo trên International Journal of Music Education (SAGE)", "Tạp chí bình duyệt", "8", "9", "9", "9", "9", "44", "✅ Tin cậy cao"]
            - ["Wikipedia – mục “Music education”", "Bách khoa mở", "9", "7", "5", "6", "8", "35", "⚠️ Chỉ để tham khảo"]
            - ["Bài blog “Mẹo dạy nhạc bằng app” (không rõ tác giả)", "Blog cá nhân", "7", "6", "2", "3", "3", "21", "❌ Không dùng"]
        - type: note
          text: "Kết luận: ưu tiên văn bản chính thức và tạp chí có bình duyệt; Wikipedia chỉ dùng để nắm khái niệm ban đầu rồi lần theo tài liệu gốc ở mục tham khảo."
      gallery: []

  - id: 3
    section: "3.4"
    title: "Viết Prompt hiệu quả cho các tác vụ học tập"
    chapter: "Chương 3 – Tổng quan về trí tuệ nhân tạo"
    objective: "Hiểu cách mô hình ngôn ngữ lớn (LLM) phản hồi theo yêu cầu, áp dụng cấu trúc prompt gồm Vai trò – Nhiệm vụ – Bối cảnh – Định dạng – Giới hạn để cải thiện kết quả cho 3 tác vụ học tập của ngành Sư phạm Âm nhạc; so sánh đầu ra giữa prompt ban đầu và prompt cải tiến."
    process:
      - "Bước 1: Chọn 3 tác vụ thực tế: soạn khung giáo án dạy hát, giải thích một khái niệm nhạc lý, lập kế hoạch luyện thanh cá nhân."
      - "Bước 2: Viết prompt ban đầu (ngắn, chung chung) và chạy thử trên ChatGPT."
      - "Bước 3: Viết lại prompt theo cấu trúc Vai trò – Nhiệm vụ – Bối cảnh – Định dạng – Giới hạn, chạy lại trong cuộc trò chuyện mới."
      - "Bước 4: So sánh hai kết quả theo 4 tiêu chí: độ chính xác, độ chi tiết, định dạng, tính ứng dụng (thang 5)."
      - "Khó khăn: Ở lần đầu, AI ghi sai số phách của nhịp 3/4 trong ví dụ – giải quyết bằng cách đối chiếu với giáo trình Lý thuyết âm nhạc và yêu cầu AI sửa lại."
      - "AI: ChatGPT là đối tượng thực nghiệm; phần phân tích, so sánh do tự viết."
    tool: "ChatGPT, Google Docs (ghi chép)"
    ai_use: "ChatGPT – đối tượng thực nghiệm"
    product:
      intro: "So sánh 3 cặp prompt và kết quả đầu ra (trích đoạn):"
      blocks:
        - type: prompts
          items:
            - task: "Soạn khung giáo án dạy hát"
              before: { prompt: "Soạn giáo án dạy hát lớp 3.", output: "Giáo án gồm: Mục tiêu, Chuẩn bị, Tiến trình dạy học, Củng cố… (nội dung chung chung, không nêu bài hát, không chia thời gian)." }
              after: { prompt: "Bạn là giáo viên Âm nhạc tiểu học. Hãy soạn khung giáo án 35 phút dạy hát một bài hát thiếu nhi nhịp 2/4 cho học sinh lớp 3 theo Chương trình GDPT 2018. Trình bày dạng bảng gồm: Hoạt động – Thời gian – Hoạt động của GV – Hoạt động của HS. Có 1 trò chơi âm nhạc khởi động và 1 hoạt động gõ đệm theo phách.", output: "Bảng 5 hoạt động: Khởi động – trò chơi “Nghe tiết tấu đoán con vật” (5′); Nghe hát mẫu (5′); Đọc lời, tập hát từng câu (12′); Hát kết hợp gõ đệm theo phách (8′); Củng cố – biểu diễn theo nhóm (5′)…" }
            - task: "Giải thích khái niệm nhạc lý"
              before: { prompt: "Hợp âm là gì?", output: "Hợp âm là sự kết hợp của ba hay nhiều âm thanh vang lên cùng lúc… (định nghĩa đúng nhưng khô, dùng thuật ngữ khó)." }
              after: { prompt: "Giải thích “hợp âm ba” cho học sinh lớp 6 mới học nhạc lý, dài khoảng 150 từ. Dùng một hình ảnh so sánh gần gũi, lấy ví dụ hợp âm Đô trưởng trên đàn phím, cuối bài có 1 câu hỏi kiểm tra nhanh.", output: "Hãy tưởng tượng hợp âm như một “món sinh tố” trộn từ 3 loại quả: mỗi nốt là một vị, khi vang cùng lúc tạo ra một màu sắc mới. Hợp âm Đô trưởng gồm Đô – Mi – Son… Câu hỏi: Hợp âm Son trưởng gồm những nốt nào?" }
            - task: "Lập kế hoạch luyện thanh"
              before: { prompt: "Lập kế hoạch luyện thanh cho tôi.", output: "Danh sách bài tập chung: hít thở, rung môi, luyện gam… (không có lịch, không theo giọng)." }
              after: { prompt: "Tôi là sinh viên năm 1 ngành Sư phạm Âm nhạc, giọng nữ cao, mỗi ngày có 30 phút luyện tập. Lập kế hoạch luyện thanh 4 tuần dạng bảng (Tuần – Mục tiêu – Bài tập – Thời lượng), tăng độ khó dần, có lưu ý bảo vệ giọng.", output: "Tuần 1: Hơi thở & tư thế (thở bụng 5′, rung môi 5′, gam 5 nốt “ma” 10′…). Tuần 2: Mở rộng âm vực… Tuần 4: Ghép bài hát. Lưu ý: không luyện quá 45′ liên tục, uống nước ấm, nghỉ khi đau họng." }
        - type: scores
          title: "Đánh giá kết quả (thang 5)"
          criteria: ["Độ chính xác", "Độ chi tiết", "Định dạng", "Tính ứng dụng"]
          before: [3, 2, 2, 2]
          after: [4, 5, 5, 5]
        - type: note
          text: "Bài học rút ra: prompt càng nêu rõ vai trò, đối tượng, bối cảnh và định dạng thì kết quả càng sát nhu cầu. Tuy vậy, kiến thức chuyên môn trong câu trả lời của AI vẫn phải được kiểm tra lại với giáo trình."
      gallery: []

  - id: 4
    section: "4.4"
    title: "Sử dụng công cụ hợp tác trực tuyến cho dự án nhóm"
    chapter: "Chương 4 – Giao tiếp và hợp tác trong môi trường số"
    objective: "Sử dụng công cụ quản lý dự án và các công cụ cộng tác trực tuyến để tổ chức một dự án nhóm 4 người: dàn dựng tiết mục hợp ca chào mừng Ngày Nhà giáo Việt Nam 20/11. Kỹ năng rèn luyện: phân công công việc, theo dõi tiến độ, giao tiếp đồng bộ và không đồng bộ."
    process:
      - "Bước 1: Cả nhóm thống nhất bộ công cụ: Trello (quản lý công việc), Google Drive (lưu bản phối, file ghi âm), Google Docs (biên bản họp), nhóm Zalo (trao đổi nhanh), Google Meet (họp trực tuyến)."
      - "Bước 2: Tạo bảng Trello 4 cột: Cần làm – Đang làm – Chờ duyệt – Hoàn thành; mỗi thẻ có người phụ trách và hạn chót."
      - "Bước 3: Chia bè và gửi file ghi âm hát mẫu từng bè lên thư mục chung để các bạn tự luyện ở nhà."
      - "Bước 4: Họp Google Meet 2 buổi/tuần để duyệt tiến độ; biên bản ghi trực tiếp vào Google Docs dùng chung."
      - "Khó khăn: Lịch học các thành viên khác nhau nên khó tập chung – giải quyết bằng cách mỗi người tự ghi âm phần bè của mình, nhóm trưởng ghép thử và góp ý qua bình luận trên Trello."
      - "AI: Dùng Gemini gợi ý mẫu “quy ước làm việc nhóm”; nhóm chỉnh sửa lại cho phù hợp."
    tool: "Trello, Google Drive, Google Docs, Google Meet, Zalo"
    ai_use: "Gemini – gợi ý mẫu quy ước làm việc nhóm"
    product:
      intro: "Bảng quản lý công việc của nhóm trên Trello (mô phỏng lại các thẻ chính):"
      blocks:
        - type: kanban
          columns:
